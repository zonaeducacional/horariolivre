appId: org.vibelab.horario
productName: Vibe Lab Horário
directories:
  output: artifacts/packages
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
linux:
  target:
    - AppImage
    - deb
  category: Education
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
